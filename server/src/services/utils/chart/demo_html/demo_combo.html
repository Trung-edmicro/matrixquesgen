<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>SẢN LƯỢNG VÀ GIÁ TRỊ SẢN XUẤT THỦY SẢN NƯỚC TA</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
      body {
        font-family: "Roboto", sans-serif;
        display: flex;
        justify-content: center;
        margin-top: 20px;
        background: #fff;
      }
      #chart {
        width: 900px;
        height: 600px;
      }
    </style>
  </head>
  <body>
    <div id="chart"></div>

    <script>
      function createPattern(type) {
        let canvas = document.createElement("canvas");
        let ctx = canvas.getContext("2d");
        canvas.width = 16;
        canvas.height = 16;

        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, 16, 16);
        ctx.strokeStyle = "#000";
        ctx.fillStyle = "#000";
        ctx.lineWidth = 1;

        if (type === "dots") {
          // Chấm bi
          ctx.beginPath();
          ctx.arc(4, 4, 1.5, 0, Math.PI * 2);
          ctx.arc(12, 12, 1.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (type === "diagonal") {
          // Sọc chéo
          ctx.beginPath();
          ctx.moveTo(0, 16);
          ctx.lineTo(16, 0);
          ctx.moveTo(-8, 8);
          ctx.lineTo(8, -8);
          ctx.moveTo(8, 24);
          ctx.lineTo(24, 8);
          ctx.stroke();
        } else if (type === "zigzag") {
          // Gợn sóng/Zigzag
          ctx.beginPath();
          ctx.moveTo(0, 4);
          ctx.lineTo(4, 0);
          ctx.lineTo(8, 4);
          ctx.lineTo(12, 0);
          ctx.lineTo(16, 4);
          ctx.moveTo(0, 12);
          ctx.lineTo(4, 8);
          ctx.lineTo(8, 12);
          ctx.lineTo(12, 8);
          ctx.lineTo(16, 12);
          ctx.stroke();
        } else if (type === "cross") {
          // Caro
          ctx.fillStyle = "#ddd";
          ctx.fillRect(0, 0, 16, 16);
          ctx.strokeStyle = "#000";
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(16, 16);
          ctx.moveTo(16, 0);
          ctx.lineTo(0, 16);
          ctx.stroke();
        } else if (type === "horizontal") {
          // Kẻ ngang
          ctx.beginPath();
          ctx.moveTo(0, 4);
          ctx.lineTo(16, 4);
          ctx.moveTo(0, 12);
          ctx.lineTo(16, 12);
          ctx.stroke();
        } else if (type === "vertical") {
          // Kẻ dọc
          ctx.beginPath();
          ctx.moveTo(4, 0);
          ctx.lineTo(4, 16);
          ctx.moveTo(12, 0);
          ctx.lineTo(12, 16);
          ctx.stroke();
        } else if (type === "grid") {
          // Lưới
          ctx.beginPath();
          ctx.moveTo(0, 8);
          ctx.lineTo(16, 8);
          ctx.moveTo(8, 0);
          ctx.lineTo(8, 16);
          ctx.stroke();
        } else if (type === "diagonal_reverse") {
          // Sọc chéo ngược
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(16, 16);
          ctx.moveTo(-8, 8);
          ctx.lineTo(8, 24);
          ctx.moveTo(8, -8);
          ctx.lineTo(24, 8);
          ctx.stroke();
        }
        return canvas;
      }

      let chartDom = document.getElementById("chart");
      let myChart = echarts.init(chartDom);

      let option = {
        title: {
          text: "SẢN LƯỢNG VÀ GIÁ TRỊ SẢN XUẤT THỦY SẢN NƯỚC TA",
          subtext: "Giai đoạn 2005 - 2017",
          left: "center",
          bottom: "12%",
          textStyle: {
            fontSize: 16,
            fontWeight: "bold",
          },
        },
        tooltip: {
          trigger: "axis",
          axisPointer: {
            type: "cross",
          },
        },
        legend: {
          data: ["Khai thác", "Nuôi trồng", "Giá trị sản xuất"],
          show: true,
          bottom: "20%",
          left: "center",
          itemWidth: 28,
          itemHeight: 14,
          itemGap: 20,
        },
        grid: {
          left: 80,
          right: 80,
          top: 80,
          bottom: 160,
          containLabel: true,
          borderColor: "#000",
          show: false,
        },
        xAxis: {
          type: "category",
          data: [
            "2005",
            "_2005_0",
            "_2005_1",
            "2010",
            "_2010_0",
            "_2010_1",
            "2015",
            "2017",
          ],
          name: "năm",
          nameLocation: "end",
          nameGap: 50,
          nameTextStyle: {
            fontSize: 13,
            color: "#000",
            fontWeight: "bold",
          },
          axisLine: {
            show: true,
            symbol: ["none", "arrow"],
            symbolSize: [8, 12],
            symbolOffset: [0, 40],
            lineStyle: {
              color: "#000",
              width: 1.5,
            },
          },
          axisTick: {
            show: false,
          },
          axisLabel: {
            color: "#000",
            fontSize: 13,
            margin: 12,
            formatter: function (value, index) {
              let d = option.series[0].data[index];
              if (d === "-" || d === null) return "";
              return value;
            },
            interval: 0,
          },
        },
        yAxis: [
          {
            type: "value",
            name: "nghìn tấn",
            nameLocation: "end",
            nameGap: 25,
            nameTextStyle: {
              fontSize: 13,
              color: "#000",
              fontWeight: "bold",
              padding: [0, 30, 0, 0],
            },
            min: 0,
            max: 7000.0,
            interval: 2000,
            axisLine: {
              show: true,
              symbol: ["none", "arrow"],
              symbolSize: [8, 12],
              lineStyle: {
                color: "#000",
                width: 1.5,
              },
            },
            axisTick: {
              show: false,
            },
            axisLabel: {
              color: "#000",
              fontSize: 12,
              formatter: function (value) {
                if (value > 6000) return "";
                // Format hàng nghìn, bỏ phần thập phân
                let valStr = value.toLocaleString("vi-VN");
                return "{value|" + valStr + "}{tick|}";
              },
              margin: 0,
              rich: {
                value: {
                  color: "#000",
                  padding: [0, 2, 0, 0],
                },
                tick: {
                  width: 5,
                  height: 1.5,
                  backgroundColor: "#000",
                  align: "right",
                },
              },
            },
            splitLine: {
              show: false,
            },
          },
          {
            type: "value",
            name: "tỉ đồng",
            nameLocation: "end",
            nameGap: 25,
            nameTextStyle: {
              fontSize: 13,
              color: "#000",
              fontWeight: "bold",
              padding: [0, 0, 0, 30],
            },
            min: 30000,
            max: 62500.0,
            interval: 5000,
            axisLine: {
              show: true,
              symbol: ["none", "arrow"],
              symbolSize: [8, 12],
              lineStyle: {
                color: "#000",
                width: 1.5,
              },
            },
            axisTick: {
              show: false,
            },
            axisLabel: {
              color: "#000",
              fontSize: 12,
              formatter: function (value) {
                if (value > 60000 || value === 0) return "";
                // Format hàng nghìn, bỏ phần thập phân
                let valStr = value.toLocaleString("vi-VN");
                return "{tick|}{value|" + valStr + "}";
              },
              margin: 0,
              rich: {
                value: {
                  color: "#000",
                  padding: [0, 0, 0, 2],
                },
                tick: {
                  width: 5,
                  height: 1.5,
                  backgroundColor: "#000",
                  align: "left",
                },
              },
            },
            splitLine: {
              show: false,
            },
          },
        ],
        series: [
          {
            name: "Khai thác",
            type: "bar",
            yAxisIndex: 0,
            data: [1988, "-", "-", 2075, "-", "-", 2280, 2421],
            barWidth: null,
            barGap: "30%",
            label: {
              show: true,
              position: "inside",
              formatter: function (params) {
                let val = params.value.toString().replace(".", ",");
                if (!val.includes(",")) val += ",0";
                return val;
              },
              fontSize: 12,
              color: "#000",
              fontWeight: "bold",
              backgroundColor: "#fff",
              padding: 0,
              borderRadius: 2,
            },
            itemStyle: {
              color: {
                type: "pattern",
                image: createPattern("dots"),
                repeat: "repeat",
              },
              borderColor: "#000",
              borderWidth: 1,
            },
            stack: "total",
          },
          {
            name: "Nuôi trồng",
            type: "bar",
            yAxisIndex: 0,
            data: [1479, "-", "-", 2125, "-", "-", 2590, 2707],
            barWidth: null,
            barGap: "30%",
            label: {
              show: true,
              position: "inside",
              formatter: function (params) {
                let val = params.value.toString().replace(".", ",");
                if (!val.includes(",")) val += ",0";
                return val;
              },
              fontSize: 12,
              color: "#000",
              fontWeight: "bold",
              backgroundColor: "#fff",
              padding: 0,
              borderRadius: 2,
            },
            itemStyle: {
              color: {
                type: "pattern",
                image: createPattern("diagonal"),
                repeat: "repeat",
              },
              borderColor: "#000",
              borderWidth: 1,
            },
            stack: "total",
          },
          {
            name: "Giá trị sản xuất",
            type: "line",
            yAxisIndex: 1,
            data: [38784, "-", "-", 47014, "-", "-", 53654, 56966],
            connectNulls: true,
            symbol: "circle",
            symbolSize: 8,
            label: {
              show: true,
              position: "top",
              formatter: function (params) {
                let val = params.value.toString().replace(".", ",");
                if (!val.includes(",")) val += ",0";
                return val;
              },
              fontSize: 12,
              color: "#000",
              fontWeight: "bold",
              backgroundColor: "#fff",
              padding: 0,
              borderRadius: 2,
            },
            lineStyle: {
              width: 2.5,
              color: "#000",
            },
            itemStyle: {
              color: "#fff",
              borderColor: "#000",
              borderWidth: 2,
            },
          },
        ],
        graphic: [
          {
            type: "text",
            left: "center",
            bottom: "7%",
            style: {
              text: "Nguồn: Bảng 2 data_table.md",
              fontSize: 11,
              fontStyle: "italic",
            },
          },
        ],
      };

      myChart.setOption(option);
    </script>
  </body>
</html>
